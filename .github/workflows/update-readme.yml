name: Update README stats

on:
  schedule:
    # runs every day at 00:15 UTC — change as you like
    - cron: "15 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch stats and update README.md
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_USERNAME: Ravindu-Buddhika
        run: python scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: auto-update README stats"
          git push
